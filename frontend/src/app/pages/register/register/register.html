<div>
  <!-- Registro (legacy template) -->
  <!-- Nota: se mantiene tal cual para evitar romper comportamiento existente -->
  <div class="success-toast" id="successToast">✅ Usuario registrado correctamente</div>
  <div class="login-container fade-in-up">
    <div class="login-card">
      <h2 style="text-align: center; margin-bottom: 1.5rem;">📝 Crear Cuenta</h2>
      <form id="registerForm">
        <div style="margin-bottom: 1rem;">
          <label>Nombre Completo:</label>
          <input type="text" id="full_name" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem;" required />
        </div>

        <div class="form-row">
          <div>
            <label>Cédula:</label>
            <input type="text" id="cedula" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem;" required />
          </div>
          <div>
            <label>Teléfono:</label>
            <input type="tel" id="phone" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem;" required />
          </div>
        </div>

        <div style="margin-bottom: 1rem;">
          <label>Correo:</label>
          <input type="email" id="email" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem;" required />
        </div>

        <div style="margin-bottom: 1rem;">
          <label>Usuario:</label>
          <input type="text" id="username" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem;" required autocomplete="username" />
        </div>

        <div style="margin-bottom: 1rem;">
          <label>Contraseña:</label>
          <input type="password" id="password" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem;" required minlength="4" autocomplete="new-password" />
        </div>

        <div style="margin-bottom: 1rem;">
          <label>Confirmar Contraseña:</label>
          <input type="password" id="confirm_password" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem;" required minlength="4" autocomplete="new-password" />
        </div>

        <div id="confirmPassError" class="error-msg">Las contraseñas no coinciden</div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="registerBtn">Registrarse</button>
      </form>

      <div style="text-align:center; margin-top:1rem; font-size:0.9rem;">
        ¿Ya tienes cuenta? <a href="/login/" style="color:var(--accent); font-weight:600;">Inicia Sesión aquí</a>
      </div>
    </div>
  </div>

  <script>
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }

    document.getElementById('registerForm')?.addEventListener('submit', function(e) {
      e.preventDefault();

      const full_name = document.getElementById('full_name').value.trim();
      const cedula = document.getElementById('cedula').value.trim();
      const email = document.getElementById('email').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirm_password = document.getElementById('confirm_password').value;
      const phone = document.getElementById('phone').value.trim();
      const btn = document.getElementById('registerBtn');

      if (!username || !password || !full_name || !cedula || !email || !phone) {
        alert('Por favor complete todos los campos');
        return;
      }

      if (password !== confirm_password) {
        document.getElementById('confirmPassError').style.display = 'block';
        return;
      }
      document.getElementById('confirmPassError').style.display = 'none';

      btn.disabled = true;
      btn.innerText = 'Registrando...';

      fetch('/api/register/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCookie('csrftoken') || ''
        },
        body: JSON.stringify({
          username: username,
          password: password,
          confirm_password: confirm_password,
          full_name: full_name,
          cedula: cedula,
          email: email,
          phone: phone
        })
      })
      .then(res => res.json())
      .then(data => {
        btn.disabled = false;
        btn.innerText = 'Registrarse';

        if (data.success) {
          document.getElementById('successToast').style.display = 'block';
          setTimeout(() => {
            document.getElementById('successToast').style.display = 'none';
            window.location.href = '/login/';
          }, 2000);
        } else {
          alert(data.message);
        }
      })
      .catch(err => {
        btn.disabled = false;
        btn.innerText = 'Registrarse';
        alert('Error de conexión. Intente nuevamente.');
        console.error(err);
      });
    });
  </script>
</div>
