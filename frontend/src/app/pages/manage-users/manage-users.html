<div class="manage-users-container fade-in-up">
  <div class="users-card">
    <h1>👥 Gestión de Usuarios</h1>
    
    <div *ngIf="loading" class="loading-state">
      Cargando usuarios...
    </div>

    <table *ngIf="!loading && users.length > 0" class="users-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Usuario</th>
          <th>Correo</th>
          <th>Teléfono</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.full_name }}</td>
          <td>{{ user.username }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.phone }}</td>
          <td>
            <button (click)="deleteUser(user.username)" class="btn-delete">🗑️ Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="!loading && users.length === 0" class="empty-state">
      No hay usuarios registrados
    </div>
  </div>
</div>
