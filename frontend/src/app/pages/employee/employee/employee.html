<div>
  <div class="dashboard">
    <header style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 2rem; border-radius: 12px; margin-bottom: 2rem; text-align: center; position: relative;">
      <h1 style="font-size: 2.5rem; margin: 0; color: white;">👨‍💼 PANEL DE EMPLEADO</h1>
      <div style="font-size: 1.2rem; opacity: 0.9; margin-top: 0.5rem; color: white;">Turnify Pro - Gestión de Turnos</div>
      <button onclick="logout()" style="position: absolute; top: 1rem; right: 1rem; background: #e53e3e; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600;">🚪 Cerrar Sesión</button>
    </header>

    <script>
      function logout() {
        localStorage.removeItem('turnify_user');
        localStorage.removeItem('turnify_role');
        fetch('/api/logout/', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } })
          .then(() => { window.location.href = '/login/'; })
          .catch(() => { window.location.href = '/login/'; });
      }
    </script>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const user = localStorage.getItem('turnify_user');
        if (!user) {
          window.location.href = '/login/';
          return;
        }
        fetch('/api/verify-session/', { method: 'GET', credentials: 'same-origin' })
          .then(res => res.json())
          .then(data => {
            if (!data.authenticated || data.role !== 'employee') {
              localStorage.removeItem('turnify_user');
              localStorage.removeItem('turnify_role');
              window.location.href = '/login/';
            }
          })
          .catch(() => {
            localStorage.removeItem('turnify_user');
            localStorage.removeItem('turnify_role');
            window.location.href = '/login/';
          });
      });
    </script>

    <div class="current-turn-section">
      <div style="font-size: 1.5rem; margin-bottom: 0.5rem;">🎫 TURNO ACTUAL</div>
      <div id="currentTurn" class="turno-actual-panel">--</div>
      <div id="currentStatus" class="estado-actual"><span style="opacity: 0.8;">Esperando turno...</span></div>
    </div>

    <div class="control-panel">
      <h2 style="margin: 0 0 1.5rem 0; color: #333;">🎛️ Panel de Control</h2>
      <div class="control-buttons">
        <button id="callBtn" class="control-btn call-btn" onclick="turnify.callNextTurn()">
          <span style="font-size: 2rem;">📢</span>
          <span>LLAMAR SIGUIENTE</span>
        </button>
        <button id="finishBtn" class="control-btn finish-btn" onclick="turnify.finishCurrentTurn()" disabled>
          <span style="font-size: 2rem;">✅</span>
          <span>TERMINAR TURNO</span>
        </button>
      </div>
    </div>

    <div class="stats-section">
      <div class="stat-card"><div id="waitingCount" class="stat-number">0</div><div class="stat-label">Turnos Esperando</div></div>
      <div class="stat-card"><div id="totalToday" class="stat-number">0</div><div class="stat-label">Total Hoy</div></div>
      <div class="stat-card"><div id="processedToday" class="stat-number">0</div><div class="stat-label">Procesados</div></div>
    </div>

    <div class="waiting-queue">
      <div class="queue-header">
        <h2 class="queue-title">📋 Cola de Espera</h2>
        <span id="queueCount" class="queue-count">0 turnos</span>
      </div>
      <div id="waitingQueue"><div class="no-turns"><p>No hay turnos en espera</p></div></div>
    </div>
  </div>

  <script src="/static/js/websocket.js"></script>
  <script src="/static/js/turns_data.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      setInterval(() => {
        turnify.fetchTurns();
        turnify.updateEmployee();
      }, 2000);
      turnify.fetchTurns();
    });
  </script>
</div>
