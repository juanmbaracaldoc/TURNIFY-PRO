<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla Digital - Turnify Pro</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎫</text></svg>">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 0%, #0f3460 100%);
            color: white;
            overflow: hidden;
        }
        .screen-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
        }
        .header-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(15, 52, 96, 0.9);
            border-bottom: 4px solid var(--accent);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .header-left {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .header-right {
            display: flex;
            gap: 2rem;
            align-items: center;
            font-size: 1.1rem;
        }
        .clock-display {
            background: rgba(52, 152, 219, 0.2);
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            border: 2px solid var(--accent);
            font-family: 'Courier New', monospace;
            font-weight: 700;
        }
        .stats-display {
            background: rgba(39, 174, 96, 0.2);
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            border: 2px solid var(--success);
            font-weight: 700;
        }
        .main-content {
            margin-top: 120px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .calling-section {
            margin-bottom: 4rem;
        }
        .calling-label {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 1rem;
            opacity: 0.9;
        }
        .calling-number {
            font-size: 12rem;
            font-weight: 900;
            color: var(--warning);
            text-shadow: 0 0 40px rgba(243, 156, 18, 0.8),
                         0 0 80px rgba(243, 156, 18, 0.4),
                         0 0 120px rgba(52, 152, 219, 0.2);
            animation: pulse 2s ease-in-out infinite;
            line-height: 1;
            margin: 0;
        }
        .next-section {
            margin-top: 4rem;
            padding: 2rem;
            background: rgba(52, 152, 219, 0.1);
            border-radius: 20px;
            border: 2px solid rgba(52, 152, 219, 0.3);
            backdrop-filter: blur(10px);
        }
        .next-label {
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ccc;
            margin-bottom: 2rem;
        }
        .next-turns-display {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .next-turn-number {
            background: linear-gradient(135deg, var(--accent), #1e8bc3);
            padding: 1.5rem 2.5rem;
            border-radius: 15px;
            font-size: 3rem;
            font-weight: 900;
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.4);
            animation: bounce 1s ease-in-out infinite;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .next-turn-number:nth-child(1) { animation-delay: 0s; }
        .next-turn-number:nth-child(2) { animation-delay: 0.15s; }
        .next-turn-number:nth-child(3) { animation-delay: 0.3s; }
        .next-turn-number:nth-child(4) { animation-delay: 0.45s; }
        .next-turn-number:nth-child(5) { animation-delay: 0.6s; }
        .empty-state {
            font-size: 3rem;
            color: #666;
            opacity: 0.8;
        }
        @keyframes pulse {
            0%, 100% { 
                text-shadow: 0 0 40px rgba(243, 156, 18, 0.8),
                             0 0 80px rgba(243, 156, 18, 0.4),
                             0 0 120px rgba(52, 152, 219, 0.2);
                transform: scale(1);
            }
            50% { 
                text-shadow: 0 0 60px rgba(243, 156, 18, 1),
                             0 0 100px rgba(243, 156, 18, 0.6),
                             0 0 150px rgba(52, 152, 219, 0.3);
                transform: scale(1.02);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header-bar">
        <div class="header-left">
            🎫 Turnify Pro - Pantalla Digital
        </div>
        <div class="header-right">
            <div class="stats-display">
                👥 En espera: <span id="waitingCount">0</span>
            </div>
            <div class="clock-display">
                🕐 <span id="timer">--:--:--</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="screen-container">
        <div class="main-content">
            <!-- Currently Calling -->
            <div class="calling-section">
                <div class="calling-label">📢 Atendiendo</div>
                <p class="calling-number" id="currentNumber">---</p>
            </div>

            <!-- Next Turns -->
            <div class="next-section">
                <div class="next-label">▼ Próximos a ser llamados</div>
                <div class="next-turns-display" id="nextTurnsDisplay">
                    <div class="empty-state">...esperando</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/websocket.js"></script>
    <script src="/static/js/turns_data.js"></script>
    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('timer').textContent = now.toLocaleTimeString('es-ES');
        }

        setInterval(updateClock, 1000);
        updateClock();

        // Update screen from turnify data
        document.addEventListener('DOMContentLoaded', function() {
            setInterval(() => {
                const waiting = turnify.stats.waiting;
                const current = turnify.currentTurn;
                const next = turnify.turns.find(t => t.status === 'waiting');

                document.getElementById('waitingCount').textContent = waiting;
                if (current) {
                    document.getElementById('currentNumber').textContent = current.number;
                }
                
                const nextDisplay = document.getElementById('nextTurnsDisplay');
                if (nextDisplay && next) {
                    nextDisplay.innerHTML = `<div class="next-turn-number">${next.number}</div>`;
                }
            }, 1000);
        });
    </script>
</body>
</html>
