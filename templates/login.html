<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Turnify Pro</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .login-container { max-width: 400px; margin: 2rem auto; padding: 2rem; }
        .login-card { background: white; border-radius: 12px; padding: 2rem; box-shadow: var(--shadow); }
        .error-msg { color: #e53e3e; font-size: 0.9rem; margin-top: 0.5rem; display: none; }
    </style>
</head>
<body>
    <div class="login-container fade-in-up">
        <div class="login-card">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">🔐 Iniciar Sesión</h2>
            <form id="loginForm">
                <div style="margin-bottom: 1rem;">
                    <label>Usuario:</label>
                    <input type="text" id="username" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem;" required>
                </div>
                <div style="margin-bottom: 1rem;">
                    <label>Contraseña:</label>
                    <input type="password" id="password" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem;" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="loginBtn">Entrar</button>
            </form>
            <div style="text-align:center; margin-top:1rem; font-size:0.9rem;">
                ¿No tienes cuenta? <a href="/register/" style="color:var(--accent); font-weight:600;">Regístrate aquí</a>
            </div>
        </div>
    </div>
    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var user = document.getElementById('username').value;
            var pass = document.getElementById('password').value;
            var btn = document.getElementById('loginBtn');

            if (!user || !pass) {
                alert('Por favor ingrese usuario y contraseña');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Ingresando...';

            fetch('/api/login/', {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken') || ''
                },
                body: JSON.stringify({
                    username: user,
                    password: pass
                })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerText = 'Entrar';

                if (data.success) {
                    localStorage.setItem('turnify_user', user);
                    localStorage.setItem('turnify_role', data.user.role);
                    window.location.href = data.redirect_url;
                } else {
                    localStorage.removeItem('turnify_user');
                    localStorage.removeItem('turnify_role');
                    alert(data.message || 'Credenciales inválidas');
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerText = 'Entrar';
                localStorage.removeItem('turnify_user');
                localStorage.removeItem('turnify_role');
                alert('Error de conexión. Intente nuevamente.');
                console.error(err);
            });
        });
    </script>
</body>
</html>
