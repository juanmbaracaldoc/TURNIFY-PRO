<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Turnify Pro</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 2rem auto;
            padding: 2rem;
        }
        .login-card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--shadow);
        }
        .document-upload {
            margin: 1rem 0;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .required-doc-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
        }
        .doc-status {
            font-size: 0.9rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }
        .doc-pending { background: #fff3cd; color: #856404; }
        .doc-uploaded { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">🔐 Iniciar Sesión</h2>
            <form id="loginForm">
                <div style="margin-bottom: 1rem;">
                    <label>Usuario:</label>
                    <input type="text" id="username" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem;" required>
                </div>
                <div style="margin-bottom: 1rem;">
                    <label>Contraseña:</label>
                    <input type="password" id="password" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem;" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var user = document.getElementById('username').value;
            if(user) {
                localStorage.setItem('employee_user', user);
                window.location.href = '/employee/';
            }
        });
    </script>
</body>
</html>
