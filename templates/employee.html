<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANEL DE EMPLEADO - Turnify Pro</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        :root {
            --lighter: #ffffff;
            --shadow-xl: 0 15px 35px rgba(0,0,0,0.2);
            --gradient-success: linear-gradient(135deg, #27ae60, #2ecc71);
            --gradient-danger: linear-gradient(135deg, #e74c3c, #c0392b);
            --gradient-primary: linear-gradient(135deg, #3498db, #2980b9);
            --gradient-warning: linear-gradient(135deg, #f39c12, #e67e22);
            --gray-50: #f9f9f9;
            --accent: #3498db;
            --shadow: 0 5px 15px rgba(0,0,0,0.1);
            --dark: #333;
            --gray-500: #666;
            --gray-600: #555;
            --radius: 12px;
        }
        .current-turn-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2.5rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .turno-actual-panel {
            font-size: 6rem !important;
            font-weight: 900 !important;
            text-shadow: 0 0 40px rgba(255,255,255,0.8) !important;
            animation: pulse 1.5s infinite !important;
            margin: 1rem 0;
        }
        .estado-actual {
            font-size: 1.5rem;
            padding: 1.5rem;
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            margin: 1rem 0;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .control-panel {
            background: var(--lighter);
            border-radius: 16px;
            padding: 2.5rem;
            margin: 2rem 0;
            box-shadow: var(--shadow-xl);
        }
        .control-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin: 2rem 0;
        }
        .control-btn {
            padding: 1.5rem 2rem;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            min-height: 80px;
            justify-content: center;
        }
        .call-btn { background: var(--gradient-success); color: white; }
        .finish-btn { background: var(--gradient-danger); color: white; }
        .finish-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .waiting-queue {
            background: var(--lighter);
            border-radius: 16px;
            padding: 2rem;
            margin: 2rem 0;
            box-shadow: var(--shadow-xl);
        }
        .documents-panel {
            background: var(--lighter);
            border-radius: 16px;
            padding: 1.5rem;
            margin: 2rem 0;
            box-shadow: var(--shadow-xl);
            border-left: 4px solid var(--gradient-warning);
        }
        .doc-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem;
            margin: 0.5rem 0;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .doc-status {
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .doc-pending { background: #fff3cd; color: #856404; }
        .doc-uploaded { background: #d4edda; color: #155724; }
        .turn-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem 1.5rem;
            margin: 0.7rem 0;
            background: var(--gray-50);
            border-radius: 12px;
            border-left: 4px solid var(--accent);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .turn-number { font-size: 1.5rem; font-weight: 700; color: #333; }
        .call-turn-btn {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        .stat-card { background: var(--lighter); border-radius: 12px; padding: 1.5rem; text-align: center; box-shadow: var(--shadow); }
        .stat-number { font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem; }
        .stat-label { color: #555; font-weight: 500; text-transform: uppercase; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="dashboard">
        <header style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 2rem; border-radius: 12px; margin-bottom: 2rem; text-align: center;">
            <h1 style="font-size: 2.5rem; margin: 0; color: white;">👨‍💼 PANEL DE EMPLEADO</h1>
            <div style="font-size: 1.2rem; opacity: 0.9; margin-top: 0.5rem; color: white;">Turnify Pro - Gestión de Turnos</div>
        </header>

        <div class="current-turn-section">
            <div style="font-size: 1.5rem; margin-bottom: 0.5rem;">🎫 TURNO ACTUAL</div>
            <div id="currentTurn" class="turno-actual-panel">--</div>
            <div id="currentStatus" class="estado-actual"><span style="opacity: 0.8;">Esperando turno...</span></div>
        </div>

        <div class="documents-panel" id="documentsPanel" style="display: none;">
            <h3 style="margin: 0 0 1rem 0; color: #333;">📎 Documentos Requeridos</h3>
            <div id="requiredDocsList"></div>
            <div style="margin-top: 1rem;">
                <input type="text" id="newDocInput" placeholder="Nombre del documento" style="padding: 0.5rem; width: 70%; border-radius: 6px; border: 1px solid #ddd;">
                <button onclick="addRequiredDocument()" class="call-turn-btn" style="width: 25%;">Agregar</button>
            </div>
        </div>

        <div class="control-panel">
            <h2 style="margin: 0 0 1.5rem 0; color: #333;">🎛️ Panel de Control</h2>
            <div class="control-buttons">
                <button id="callBtn" class="control-btn call-btn" onclick="turnify.callNextTurn()"><span style="font-size: 2rem;">📢</span><span>LLAMAR SIGUIENTE</span></button>
                <button id="finishBtn" class="control-btn finish-btn" onclick="turnify.finishCurrentTurn()" disabled><span style="font-size: 2rem;">✅</span><span>TERMINAR TURNO</span></button>
            </div>
        </div>

        <div class="stats-section">
            <div class="stat-card"><div id="waitingCount" class="stat-number">0</div><div class="stat-label">Turnos Esperando</div></div>
            <div class="stat-card"><div id="totalToday" class="stat-number">0</div><div class="stat-label">Total Hoy</div></div>
            <div class="stat-card"><div id="processedToday" class="stat-number">0</div><div class="stat-label">Procesados</div></div>
        </div>

        <div class="waiting-queue">
            <div class="queue-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 class="queue-title" style="font-size: 1.8rem; font-weight: 700; color: #333; margin: 0;">📋 Cola de Espera</h2>
                <span id="queueCount" class="queue-count" style="background: var(--gradient-primary); color: white; padding: 0.5rem 1rem; border-radius: 20px; font-weight: 600;">0 turnos</span>
            </div>
            <div id="waitingQueue"><p style="text-align: center; color: #333;">No hay turnos en espera</p></div>
        </div>
    </div>

    <script src="/static/js/websocket.js"></script>
    <script src="/static/js/turns_data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            setInterval(() => { turnify.fetchTurns(); turnify.updateEmployee(); }, 2000);
            turnify.fetchTurns();
        });
        
        async function addRequiredDocument() {
            const input = document.getElementById('newDocInput');
            const docName = input.value.trim();
            if (!docName || !currentTurnNumber) return;
            const response = await fetch('/api/documents/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ number: currentTurnNumber, documents: [docName] })
            });
            const data = await response.json();
            if (data.success) { input.value = ''; updateDocumentsPanel(); }
        }
        
        let currentTurnNumber = null;
        
        function updateDocumentsPanel() {
            const panel = document.getElementById('documentsPanel');
            const list = document.getElementById('requiredDocsList');
            if (!currentTurnNumber) { panel.style.display = 'none'; return; }
            panel.style.display = 'block';
        }
    </script>
</body>
</html>
