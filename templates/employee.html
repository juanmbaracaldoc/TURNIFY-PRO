<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANEL DE EMPLEADO - Turnify Pro</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎫</text></svg>">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        :root {
            --lighter: #ffffff;
            --shadow-xl: 0 15px 35px rgba(0,0,0,0.2);
            --gradient-success: linear-gradient(135deg, #27ae60, #2ecc71);
            --gradient-danger: linear-gradient(135deg, #e74c3c, #c0392b);
            --gradient-primary: linear-gradient(135deg, #3498db, #2980b9);
            --gray-50: #f9f9f9;
            --accent: #3498db;
            --shadow: 0 5px 15px rgba(0,0,0,0.1);
            --dark: #333;
            --gray-500: #666;
            --gray-600: #555;
            --radius: 12px;
        }
        .current-turn-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2.5rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .current-turn-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="75" cy="75" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="50" cy="10" r="0.5" fill="rgba(255,255,255,0.1)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            opacity: 0.1;
        }

        .current-turn-section > * {
            position: relative;
            z-index: 1;
        }

        .turno-actual-panel {
            font-size: 6rem !important;
            font-weight: 900 !important;
            text-shadow: 0 0 40px rgba(255,255,255,0.8) !important;
            animation: pulse 1.5s infinite !important;
            margin: 1rem 0;
        }

        .estado-actual {
            font-size: 1.5rem;
            padding: 1.5rem;
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            margin: 1rem 0;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .control-panel {
            background: var(--lighter);
            border-radius: 16px;
            padding: 2.5rem;
            margin: 2rem 0;
            box-shadow: var(--shadow-xl);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .control-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .control-btn {
            padding: 1.5rem 2rem;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            min-height: 80px;
            justify-content: center;
        }

        .call-btn {
            background: var(--gradient-success);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(72, 187, 120, 0.39);
        }

        .call-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(72, 187, 120, 0.5);
        }

        .finish-btn {
            background: var(--gradient-danger);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(229, 62, 62, 0.39);
        }

        .finish-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(229, 62, 62, 0.5);
        }

        .finish-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .waiting-queue {
            background: var(--lighter);
            border-radius: 16px;
            padding: 2rem;
            margin: 2rem 0;
            box-shadow: var(--shadow-xl);
        }

        .queue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .queue-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333;
            margin: 0;
        }

        .queue-count {
            background: var(--gradient-primary);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
        }

        .turn-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem 1.5rem;
            margin: 0.7rem 0;
            background: var(--gray-50);
            border-radius: 12px;
            border-left: 4px solid var(--accent);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .turn-item:hover {
            transform: translateX(5px);
            box-shadow: var(--shadow);
            background: white;
        }

        .turn-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
        }

        .turn-time {
            color: #666;
            font-size: 0.9rem;
        }

        .call-turn-btn {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .call-turn-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 179, 237, 0.4);
        }

        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .stat-card {
            background: var(--lighter);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: #555;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.9rem;
        }

        .no-turns {
            text-align: center;
            color: #333;
            padding: 3rem;
            font-size: 1.2rem;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 2rem; border-radius: 12px; margin-bottom: 2rem; text-align: center; position: relative;">
            <h1 style="font-size: 2.5rem; margin: 0; color: white;">👨‍💼 PANEL DE EMPLEADO</h1>
            <div style="font-size: 1.2rem; opacity: 0.9; margin-top: 0.5rem; color: white;">Turnify Pro - Gestión de Turnos</div>
            <button onclick="logout()" style="position: absolute; top: 1rem; right: 1rem; background: #e53e3e; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600;">🚪 Cerrar Sesión</button>
        </header>
        <script>
        function logout() {
            localStorage.removeItem('turnify_user');
            localStorage.removeItem('turnify_role');
            fetch('/api/logout/', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } })
            .then(() => { window.location.href = '/login/'; })
            .catch(() => { window.location.href = '/login/'; });
        }
        </script>
        
        <script>
        document.addEventListener('DOMContentLoaded', function() {
            const user = localStorage.getItem('turnify_user');
            if (!user) {
                window.location.href = '/login/';
                return;
            }
            fetch('/api/verify-session/', { method: 'GET', credentials: 'same-origin' })
            .then(res => res.json())
            .then(data => {
                if (!data.authenticated || data.role !== 'employee') {
                    localStorage.removeItem('turnify_user');
                    localStorage.removeItem('turnify_role');
                    window.location.href = '/login/';
                }
            })
            .catch(() => {
                localStorage.removeItem('turnify_user');
                localStorage.removeItem('turnify_role');
                window.location.href = '/login/';
            });
        });
        </script>

        <!-- Current Turn Section -->
        <div class="current-turn-section">
            <div style="font-size: 1.5rem; margin-bottom: 0.5rem;">🎫 TURNO ACTUAL</div>
            <div id="currentTurn" class="turno-actual-panel">--</div>
            <div id="currentStatus" class="estado-actual">
                <span style="opacity: 0.8;">Esperando turno...</span>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <h2 style="margin: 0 0 1.5rem 0; color: #333;">🎛️ Panel de Control</h2>
            <div class="control-buttons">
                <button id="callBtn" class="control-btn call-btn" onclick="turnify.callNextTurn()">
                    <span style="font-size: 2rem;">📢</span>
                    <span>LLAMAR SIGUIENTE</span>
                </button>
                <button id="finishBtn" class="control-btn finish-btn" onclick="turnify.finishCurrentTurn()" disabled>
                    <span style="font-size: 2rem;">✅</span>
                    <span>TERMINAR TURNO</span>
                </button>
            </div>
        </div>

        <!-- Stats Section -->
        <div class="stats-section">
            <div class="stat-card">
                <div id="waitingCount" class="stat-number">0</div>
                <div class="stat-label">Turnos Esperando</div>
            </div>
            <div class="stat-card">
                <div id="totalToday" class="stat-number">0</div>
                <div class="stat-label">Total Hoy</div>
            </div>
            <div class="stat-card">
                <div id="processedToday" class="stat-number">0</div>
                <div class="stat-label">Procesados</div>
            </div>
        </div>

        <!-- Waiting Queue -->
        <div class="waiting-queue">
            <div class="queue-header">
                <h2 class="queue-title">📋 Cola de Espera</h2>
                <span id="queueCount" class="queue-count">0 turnos</span>
            </div>
            <div id="waitingQueue">
                <div class="no-turns">
                    <p>No hay turnos en espera</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/websocket.js"></script>
    <script src="/static/js/turns_data.js"></script>
    <script>
        // Employee page initialization
        document.addEventListener('DOMContentLoaded', function() {
            // Auto-update every 2 seconds for real-time
            setInterval(() => {
                turnify.fetchTurns();
                turnify.updateEmployee();
            }, 2000);
            
            // Initial fetch
            turnify.fetchTurns();
        });
    </script>
</body>
</html>
